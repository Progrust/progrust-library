<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Zen Kaku Gothic New',sans-serif">
<!-- 編集用原本（本カバー画像: rust-learning・案D）。配信版は public/images/books/rust-learning.svg（導出手順は docs/ui-design/ui-design-spec.md 参照） -->
  <rect width="1200" height="630" fill="#F2F0EC"/>

  <!-- workbook grid -->
  <g stroke="#D9D3CA">
    <line x1="105" y1="0" x2="105" y2="630"/><line x1="210" y1="0" x2="210" y2="630"/>
    <line x1="315" y1="0" x2="315" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="525" y1="0" x2="525" y2="630"/><line x1="630" y1="0" x2="630" y2="630"/>
    <line x1="735" y1="0" x2="735" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="945" y1="0" x2="945" y2="630"/><line x1="1050" y1="0" x2="1050" y2="630"/>
    <line x1="1155" y1="0" x2="1155" y2="630"/>
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
  </g>

  <!-- scattered tokens -->
  <g font-family="'JetBrains Mono',monospace" font-size="32" fill="#847A6E" text-anchor="middle">
    <text x="157" y="64">fn</text>
    <text x="367" y="64">let</text>
    <text x="577" y="64" fill="#C63D22">mut</text>
    <text x="892" y="64">match</text>
    <text x="1102" y="64" fill="#C63D22">&amp;</text>
    <text x="52" y="169">-></text>
    <text x="262" y="169">impl</text>
    <text x="682" y="169">for</text>
    <text x="1049" y="274">::</text>
    <text x="1154" y="274">if</text>
    <text x="1049" y="379">'a</text>
    <text x="1154" y="379">?</text>
    <text x="157" y="484">use</text>
    <text x="367" y="484">enum</text>
    <text x="577" y="484">pub</text>
    <text x="1102" y="484">//</text>
    <text x="472" y="589">i32</text>
    <text x="682" y="589">else</text>
    <text x="892" y="589">Some</text>
    <text x="1102" y="589">!</text>
  </g>

  <!-- run cell + check cell -->
  <rect x="945" y="105" width="105" height="105" fill="#C63D22"/>
  <path d="M983 133 L1022 157.5 L983 182 Z" fill="#FBF9F6"/>
  <path d="M760 468 l18 20 l32 -40" fill="none" stroke="#C63D22" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- title plate -->
  <rect x="94" y="214" width="760" height="218" fill="#C63D22"/>
  <rect x="80" y="200" width="760" height="218" fill="#FBF9F6" stroke="#29241F" stroke-width="2.5"/>
  <text x="120" y="254" font-family="'JetBrains Mono',monospace" font-size="24" fill="#C63D22">// hands-on drills</text>
  <text x="120" y="312" font-size="36" font-weight="700" fill="#3A342D">動かして学ぶ</text>
  <text x="118" y="384" font-size="54" font-weight="900" fill="#29241F" letter-spacing="-1">Rustプログラミング問題集</text>

  <text x="90" y="612" font-family="'JetBrains Mono',monospace" font-size="24" fill="#847A6E">blog.progrust.com</text>
</svg>
